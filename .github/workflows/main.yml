name: Build APK Ipank
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Rakit APK
        run: |
          mkdir -p app/src/main/java/com/ipank/loader
          mkdir -p app/src/main/res/layout
          mv MainActivity.java app/src/main/java/com/ipank/loader/ || true
          mv AndroidManifest.xml app/src/main/ || true
          echo '<?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://android.com" android:layout_width="match_parent" android:layout_height="match_parent" />' > app/src/main/res/layout/activity_main.xml
          gradle assembleDebug
      - name: Upload Hasil
        uses: actions/upload-artifact@v4
        with:
          name: Ipank-Loader-Sultan
          path: "**/*.apk"
          
