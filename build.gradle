buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Versi ini yang paling stabil untuk Java 17
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

plugins {
    id 'com.android.application'
}

android {
    compileSdk 33
    namespace 'com.ipank.loader'

    defaultConfig {
        applicationId "com.ipank.loader"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['MainActivity.java']
        }
    }
}
