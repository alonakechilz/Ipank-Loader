buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Versi ini yang paling cocok dengan robot GitHub sekarang
        classpath 'com.android.tools.build:gradle:7.0.4'
    }
}

apply plugin: 'com.android.application'

android {
    // Pakai SDK terbaru yang didukung GitHub
    compileSdk 31
    defaultConfig {
        applicationId "com.ipank.loader"
        minSdk 21
        targetSdk 31
        versionCode 1
        versionName "1.0"
    }

    // Mantra penunjuk jalan agar robot nemu folder kamu
    sourceSets {
        main {
            manifest.srcFile 'app/src/main/AndroidManifest.xml'
            java.srcDirs = ['app/src/main/java']
            res.srcDirs = ['app/src/main/res']
        }
    }
}
